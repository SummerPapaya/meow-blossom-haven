<style>
  :root{--ink:#fff7ef;--gold:rgba(255,226,186,.5);--glow:rgba(255,205,180,.55)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f2e;color:var(--ink);

  @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    .glass{background:linear-gradient(160deg,rgba(98,70,156,.58),rgba(58,40,112,.5));-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}}
  .glass,#title b{text-shadow:0 1px 5px rgba(40,20,80,.55)}
  #title b{text-shadow:0 0 18px rgba(255,190,220,.75),0 2px 10px rgba(30,10,70,.65),0 0 3px rgba(40,20,80,.6)}
  .serif{font-family:"Cormorant Garamond","Songti SC","STSong","Noto Serif SC",Georgia,serif}
  /* title */
  #title{position:fixed;left:20px;top:16px;top:calc(16px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));pointer-events:none;max-width:70vw}
  #title b{display:block;font-size:30px;font-style:italic;font-weight:700;letter-spacing:.02em;line-height:1.05;
    text-shadow:0 0 18px rgba(255,190,220,.75),0 2px 10px rgba(30,10,70,.5)}
  #title b::before{content:"✦ ";font-style:normal;font-size:16px;vertical-align:middle;color:#ffe2b0}
  #status{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:999px;font-size:12.5px;letter-spacing:.06em}
  /* environment dock */
  #dock{position:fixed;right:14px;top:0;bottom:0;margin:auto 0;height:-webkit-fit-content;height:fit-content;display:flex;flex-direction:column;align-items:center;padding:8px;padding:min(10px,1.8vh) 8px;border-radius:999px}
  #dock>*+*{margin-top:8px;margin-top:min(9px,1.6vh)} .supports-flex-gap #dock{gap:9px;gap:min(9px,1.6vh)} .supports-flex-gap #dock>*+*{margin-top:0}
  .orb{position:relative}
  .rb{width:38px;height:38px;width:clamp(30px,8.4vh,42px);height:clamp(30px,8.4vh,42px);border-radius:50%;padding:0;font-size:19px;display:grid;place-items:center;border:1px solid var(--gold);
    background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.38),rgba(255,255,255,.05) 70%)}
  .rb:hover{transform:scale(1.1);box-shadow:0 0 18px var(--glow)}
  .rb.on,.orb.open .rb{background:radial-gradient(circle at 35% 28%,#fff6dc,#ffcfe0 55%,#cdb9ff);box-shadow:0 0 16px rgba(255,210,228,.85);border-color:transparent}
  .sep{width:18px;height:1px;background:var(--gold)}
  .fly{position:absolute;right:56px;top:-12px;display:none;padding:7px 12px;border-radius:999px}
  .fly>*+*{margin-left:6px} .supports-flex-gap .fly{gap:6px} .supports-flex-gap .fly>*+*{margin-left:0}
  .orb.open .fly{display:flex}
  .fly button{display:grid;justify-items:center;grid-gap:1px;gap:1px;background:none;border:none;padding:2px 5px;font-size:21px;opacity:.82}
  .fly button small{font-size:11px;letter-spacing:.1em;white-space:nowrap}
  .fly button:hover{opacity:1;transform:translateY(-2px)}
  .fly button.on{opacity:1;text-shadow:0 0 10px #ffdca8} .fly button.on small{color:#ffe7b4;font-weight:700}
  /* action charms */
  #actions{position:fixed;left:0;right:0;bottom:14px;bottom:calc(14px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));margin:0 auto;width:-webkit-fit-content;width:fit-content;display:flex;flex-wrap:wrap;justify-content:center;padding:5px 13px 3px;border-radius:30px;
    max-width:calc(100vw - 16px)}
  #actions button{margin:5px 7px;display:grid;justify-items:center;grid-gap:4px;gap:4px;background:none;border:none;padding:0;font-size:11.5px;letter-spacing:.1em;white-space:nowrap}
  #actions i{font-style:normal;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;border:1px solid var(--gold);transition:.22s;
    background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.38),rgba(255,255,255,.05) 70%)}
  #actions button:hover i{transform:translateY(-4px) scale(1.08);box-shadow:0 8px 22px var(--glow);background:radial-gradient(circle at 35% 28%,#fff6dc,#ffcfe0 55%,#cdb9ff)}
  #who{flex-basis:100%;text-align:center;font-size:11.5px;letter-spacing:.06em;opacity:.85;margin:3px 0 0} #who[hidden]{display:none}
  .supports-flex-gap #actions{gap:10px 14px;padding:10px 20px 8px} .supports-flex-gap #actions button{margin:0}
  #hint{position:fixed;left:0;right:0;bottom:96px;text-align:center;font-size:12px;color:rgba(255,247,239,.7);pointer-events:none;letter-spacing:.12em;
    text-shadow:0 1px 6px rgba(0,0,0,.45);white-space:nowrap}
  #catPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;max-width:calc(100vw - 32px);max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:18px 20px 16px;border-radius:24px;z-index:8;font-size:14px}
  #catPanel[hidden]{display:none}
  .cp-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px} .cp-h b{font-size:19px;letter-spacing:.06em}
  .cp-x{background:none;border:none;font-size:22px;line-height:1;padding:2px 6px;opacity:.85}
  .cp-cat{display:flex;align-items:center;padding:9px 10px;margin-bottom:8px;border-radius:16px;border:1px solid rgba(255,226,186,.28);background:rgba(255,255,255,.06);cursor:pointer}
  .cp-cat.sel{border-color:rgba(255,214,232,.9);background:rgba(255,214,232,.18)}
  .cp-sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:3px;border:1px solid rgba(255,255,255,.5);flex:none}
  .cp-who{flex:1;min-width:0;margin-left:8px} .cp-who b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .cp-who small{opacity:.78}

  .cp-btn.main{background:linear-gradient(135deg,#fff0d0,#ffc4dc,#cdb9ff);color:#5a3565;border:none;font-weight:700}
  .cp-grp{font-size:11.5px;opacity:.75;margin:8px 2px 2px;letter-spacing:.06em} .cp-btn.warn{background:#ff8fab;color:#4a1830;border-color:#ff8fab;font-weight:700}
  .cp-btn[disabled]{opacity:.45;cursor:default}
  .cp-bond{display:block;color:#ffc4dc;letter-spacing:.08em;font-size:12px}
  .cp-sec{margin:12px 0 6px;font-size:13px;opacity:.85;letter-spacing:.06em}
  .cp-chip{display:inline-block;margin:0 6px 6px 0;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,226,186,.4);background:rgba(255,255,255,.08);font-size:13px}
  .cp-chip.on{background:rgba(255,214,232,.32);border-color:rgba(255,214,232,.95)}
  .cp-chip .cp-sw{width:10px;height:10px;margin-right:2px;vertical-align:-1px}
  .cp-in{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:12px;border:1px solid var(--gold);background:rgba(255,255,255,.14);color:var(--ink);font:inherit;font-size:15px}
  .cp-in::placeholder{color:rgba(255,247,239,.55)}
  .cp-row{display:flex;justify-content:flex-end;align-items:center;margin-top:14px} .cp-note{flex:1;font-size:12px;opacity:.7}
  #photoView{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(14,10,40,.55);padding:16px}
  #photoView[hidden]{display:none}
  .pv-in{padding:14px;border-radius:22px;max-width:100%;text-align:center}
  #photoImg{display:block;max-width:100%;max-height:72vh;border-radius:14px;margin:0 auto}
  .pv-row{margin-top:12px} .pv-row .cp-btn{margin:4px}
  #tip{position:fixed;pointer-events:none;padding:5px 13px;font-size:12.5px;border-radius:999px;display:none;letter-spacing:.06em;
    background:rgba(70,40,95,.82);border:1px solid var(--gold);white-space:nowrap}
  #flash{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:4;display:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 50% 55%,#d9c8f6,#a48fdc 50%,#5d4fae)}
  /* start */
  #start{position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;text-align:center;z-index:10;transition:opacity .9s;
    background:radial-gradient(ellipse at 50% 35%,rgba(140,100,210,.55),rgba(11,15,46,.93))}
  #start h1{margin:0;font-size:48px;font-size:clamp(36px,7vw,68px);font-style:italic;font-weight:700;
    background:linear-gradient(120deg,#ffd6e8,#fff6e0,#cdb9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #start p{margin:10px 0 28px;opacity:.85;font-size:15px;letter-spacing:.3em}
  #start button{font-size:16px;letter-spacing:.2em;padding:13px 36px;border-radius:999px;border:none;font-weight:700;color:#5a3565;
    background:linear-gradient(135deg,#fff0d0,#ffc4dc,#cdb9ff);box-shadow:0 10px 40px rgba(255,180,220,.5)}
  #start button:hover{box-shadow:0 10px 50px rgba(255,200,230,.8)}
  #start button:disabled{opacity:.55;cursor:default;box-shadow:none}
  #start small{display:block;margin-top:18px;opacity:.55;font-size:12px;letter-spacing:.1em}
  #fallback{position:fixed;top:0;right:0;bottom:0;left:0;z-index:12;display:none;align-content:center;justify-items:center;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 35%,#5a3fa6,#1d1650)}
  #fallback b{font:italic 700 30px Georgia,serif;color:#ffe3f0} #fallback p{max-width:22em;margin:14px 0 20px;line-height:1.6;opacity:.85}
  #fallback button{padding:10px 28px;border-radius:999px;border:none;font-weight:700;color:#5a3565;background:linear-gradient(135deg,#fff0d0,#ffc4dc,#cdb9ff)}
  @media (max-width:720px),(max-height:560px){
    #title b{font-size:22px} #hint{display:none}
    #dock{padding:7px 6px;right:8px} #dock>*+*{margin-top:6px} .supports-flex-gap #dock{gap:6px} .supports-flex-gap #dock>*+*{margin-top:0} .rb{width:36px;height:36px;font-size:16px} .fly{right:48px}
    #actions{padding:3px 9px 1px} #actions button{margin:5px} .supports-flex-gap #actions{gap:10px;padding:8px 14px 6px} .supports-flex-gap #actions button{margin:0} #actions i{width:38px;height:38px;font-size:18px}
  }
</style>

<div id="title"><b class="serif">Meow Blossom Haven</b><span id="status" class="glass">猪猪正在等你…</span></div>

  <div class="orb" data-k="island"><button class="rb cur" title="浮空岛"></button><div class="fly glass">

  <span class="sep"></span>
  <div class="orb" data-k="season"><button class="rb cur" title="季节"></button><div class="fly glass">

    <button data-v="autumn" data-e="🍁">🍁<small>秋</small></button><button data-v="winter" data-e="❄️">❄️<small>冬</small></button></div></div>
  <div class="orb" data-k="time"><button class="rb cur" title="天光"></button><div class="fly glass">
    <button data-v="dawn" data-e="🌅">🌅<small>晨</small></button><button data-v="day" data-e="☀️">☀️<small>昼</small></button>

  <div class="orb" data-k="weather"><button class="rb cur" title="天气"></button><div class="fly glass">
    <button data-v="clear" data-e="✨">✨<small>晴</small></button><button data-v="cloudy" data-e="☁️">☁️<small>云</small></button>
    <button data-v="rain" data-e="🌧️">🌧️<small>雨</small></button><button data-v="snow" data-e="🌨️">🌨️<small>雪</small></button></div></div>
